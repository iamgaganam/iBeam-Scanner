name: ibeam_scanner
description: ProxiMate iBeacon scanner and proximity alert app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^21.0.0
  flutter_svg: ^2.2.0
  get_it: ^9.2.1
  google_sign_in: ^7.2.0
  ibeacon_wrapper:
    path: packages/ibeacon_wrapper
  permission_handler: ^12.0.1
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/alerts.json
    - assets/logo.png

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/logo.png
    background_color: '#FFFFFF'
    theme_color: '#1E3A9F'
  windows:
    generate: true
    image_path: assets/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/logo.png
